name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # backend/Dockerfile's build context is backend/ itself.
          - image: api
            context: ./backend
            dockerfile: backend/Dockerfile
          # worker/Dockerfile's build context is the repo root, not worker/ -
          # it COPYs backend/app to reuse backend code (see worker/Dockerfile).
          - image: worker
            context: .
            dockerfile: worker/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build ${{ matrix.context }} --file ${{ matrix.dockerfile }} --tag ai-ats-checker-${{ matrix.image }}:$(date +%s)
